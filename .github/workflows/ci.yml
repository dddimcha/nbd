name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: Format
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race ./...
      - name: Fuzz smoke
        run: go test -run='^$' -fuzz=FuzzDeserialize -fuzztime=30s ./blockdevice
      - name: Bench smoke
        run: go test -run='^$' -bench=. -benchtime=1x ./blockdevice
